<nz-layout>
  <nz-header style="position: fixed; top: 0; left: 0; right: 0; height: 64px; background: #001529; color: white; display: flex; align-items: center; padding: 0 16px; z-index: 1100;">
    
    <span
      style="cursor: pointer; margin-left: 15px;"
      (click)="toggleCollapsed()"
    >
      <i nz-icon [nzType]="isCollapsed ? 'menu-unfold' : 'menu-fold'" nzTheme="outline" style="font-size: 20px;"></i>
    </span>

    <span style="position: absolute; left: 50%; transform: translateX(-50%); font-weight: 600;">
      {{ getUserTypeSpanish() }}
    </span>

  </nz-header>

  <nz-sider
    [nzCollapsed]="isCollapsed"
    nzTheme="dark"
    [nzWidth]="250"
    [nzCollapsedWidth]="80"
    style="height: 100vh; position: fixed; top: 64px; left: 0; z-index: 1000;"
  >
    <ul
      nz-menu
      nzTheme="dark"
      nzMode="inline"
      [nzInlineCollapsed]="isCollapsed"
      style="height: 100%; border-right: 0;"
    >
      <li nz-menu-item nzKey="dashboard" (click)="navigateTo('/dashboard')" title="Inicio" [class.ant-menu-item-selected]="selectedKey==='dashboard'">
        <i nz-icon nzType="home" nzTheme="outline" style="font-size: 18px; margin-right: 10px;"></i>
        <span *ngIf="!isCollapsed">Inicio</span>
      </li>

      <li nz-menu-item nzKey="requester-edit" (click)="navigateTo('/requester-edit')" title="Mi información" [class.ant-menu-item-selected]="selectedKey==='requester-edit'">
        <i nz-icon nzType="user" nzTheme="outline" style="font-size: 18px; margin-right: 10px;"></i>
        <span *ngIf="!isCollapsed">Mi información</span>
      </li>

      <li 
        nz-menu-item 
        nzKey="form"
        (click)="!hasActiveSolicitud && navigateTo('/form')" 
        [nzDisabled]="hasActiveSolicitud"
        [title]="hasActiveSolicitud ? 'Ya tiene una solicitud en proceso' : 'Solicitud de crédito'"
        [class.ant-menu-item-selected]="selectedKey==='form'"
      >
        <i 
          nz-icon 
          nzType="file-text" 
          nzTheme="outline" 
          [style.color]="hasActiveSolicitud ? '#888888' : '#53E3ED'" 
          style="font-size: 18px; margin-right: 10px;"
        ></i>
        <span *ngIf="!isCollapsed" [style.color]="hasActiveSolicitud ? '#888888' : ''">
          Solicitud de crédito
        </span>
      </li>

      <li *ngIf="userType === 'supervisor'" nz-menu-item nzKey="sign-staff" (click)="navigateTo('/sign-staff')" title="Registro de colaboradores" [class.ant-menu-item-selected]="selectedKey==='sign-staff'">
        <i nz-icon nzType="team" nzTheme="outline" style="font-size: 18px; margin-right: 10px;"></i>
        <span *ngIf="!isCollapsed">Registro de colaboradores</span>
      </li>

      <li nz-menu-item nzKey="login" (click)="logout()" title="Salir" [class.ant-menu-item-selected]="selectedKey==='login'">
        <i nz-icon nzType="logout" nzTheme="outline" style="font-size: 18px; margin-right: 10px;"></i>
        <span *ngIf="!isCollapsed">Salir</span>
      </li>
    </ul>
  </nz-sider>
</nz-layout>
